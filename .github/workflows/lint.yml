name: lint

on: push

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: 1.26

      - name: Run golangci-lint linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
